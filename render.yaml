services:
  - type: web
    name: loan-approval-api
    env: docker
    dockerfilePath: ./Dockerfile.backend
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: DB_NAME
        value: loan_approval_db
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ORIGINS
        sync: false
